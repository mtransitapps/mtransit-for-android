# ORIGINAL FILE: https://github.com/mtransitapps/commons/tree/master/shared-overwrite-all-repositories
# https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
code_review:
  pull_request_opened:
    include_drafts: false
ignore_patterns:
  - 'app-android/src/main/res/raw/**'
  - 'app-android/src/main/res-current/raw/**'
  - 'app-android/src/main/res-next/raw/**'
  - '**/*.png'
