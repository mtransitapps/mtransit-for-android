name: MT sync code
on:
  workflow_dispatch: # manual
# gh workflow run mt-sync-code.yml --ref <branch>
# gh run list --workflow=mt-sync-code.yml
# gh run watch ; gh browse --branch <branch>
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # git branches & sha
  MT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MT_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  MT_TARGET_BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
  MT_DEFAULT_BRANCH_NAME: ${{ github.event.repository.default_branch }}
  # git commit & push
  MT_ORG_GIT_COMMIT_ON: ${{ secrets.MT_ORG_GIT_COMMIT_ON }}
  MT_ORG_GIT_COMMIT_OFF: ${{ secrets.MT_ORG_GIT_COMMIT_OFF }}
  MT_GIT_COMMIT_ON: ${{ secrets.MT_GIT_COMMIT_ON }}
  MT_GIT_COMMIT_OFF: ${{ secrets.MT_GIT_COMMIT_OFF }}
  # push to store
  MT_ORG_PUSH_STORE_ON: ${{ secrets.MT_ORG_PUSH_STORE_ON }}
  MT_ORG_PUSH_STORE_OFF: ${{ secrets.MT_ORG_PUSH_STORE_OFF }}
  MT_PUSH_STORE_ON: ${{ secrets.MT_PUSH_STORE_ON }}
  MT_PUSH_STORE_OFF: ${{ secrets.MT_PUSH_STORE_OFF }}
  # push to store > alpha
  MT_ORG_STORE_ALPHA_ON: ${{ secrets.MT_ORG_STORE_ALPHA_ON }}
  MT_ORG_STORE_ALPHA_OFF: ${{ secrets.MT_ORG_STORE_ALPHA_OFF }}
  MT_STORE_ALPHA_ON: ${{ secrets.MT_STORE_ALPHA_ON }}
  MT_STORE_ALPHA_OFF: ${{ secrets.MT_STORE_ALPHA_OFF }}
  # push to store > private beta
  MT_ORG_STORE_BETA_PRIVATE_ON: ${{ secrets.MT_ORG_STORE_BETA_PRIVATE_ON }}
  MT_ORG_STORE_BETA_PRIVATE_OFF: ${{ secrets.MT_ORG_STORE_BETA_PRIVATE_OFF }}
  MT_STORE_BETA_PRIVATE_ON: ${{ secrets.MT_STORE_BETA_PRIVATE_ON }}
  MT_STORE_BETA_PRIVATE_OFF: ${{ secrets.MT_STORE_BETA_PRIVATE_OFF }}
  # push to store > production
  MT_ORG_STORE_PRODUCTION_ON: ${{ secrets.MT_ORG_STORE_PRODUCTION_ON }}
  MT_ORG_STORE_PRODUCTION_OFF: ${{ secrets.MT_ORG_STORE_PRODUCTION_OFF }}
  MT_STORE_PRODUCTION_ON: ${{ secrets.MT_STORE_PRODUCTION_ON }}
  MT_STORE_PRODUCTION_OFF: ${{ secrets.MT_STORE_PRODUCTION_OFF }}
jobs:
  MT-CANCEL-BUILD-JOB:
    name: "MT Cancel running builds"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: MT cancel in-progress build runs
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_IDS=$(gh run list --workflow mt-build.yml --branch "$MT_DEFAULT_BRANCH_NAME" --status in_progress \
            --limit 1000 --json databaseId,event --jq '.[] | select(.event != "pull_request" and .event != "pull_request_target") | .databaseId' \
            --repo "$GITHUB_REPOSITORY")
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            if ! gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"; then
              STATUS=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
              if [ "$STATUS" != "completed" ]; then
                exit 1
              fi
              echo "Build run $RUN_ID already completed."
            fi
          done <<< "$RUN_IDS"

  MT-SYNC-CODE-JOB:
    name: "MT Sync Code"
    needs: MT-CANCEL-BUILD-JOB
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: MT check out main repository code (no submodules)
        uses: actions/checkout@v7
        with:
          submodules: true # required to set right token
          token: ${{ secrets.MT_PAT }}
          fetch-depth: 0 # fetch all (not required util release build)
      - name: MT cancel in-progress submodule build runs
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.MT_PAT }}
        run: |
          git submodule foreach '
            DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq ".defaultBranchRef.name") || exit 1
            [ -n "$DEFAULT_BRANCH" ] || exit 1
            RUN_IDS=$(gh run list --workflow mt-build.yml --branch "$DEFAULT_BRANCH" --status in_progress --limit 1000 \
              --json databaseId,event --jq ".[] | select(.event != \"pull_request\" and .event != \"pull_request_target\") | .databaseId") || exit 1
            for RUN_ID in $RUN_IDS; do
              [ -n "$RUN_ID" ] || continue
              if ! gh run cancel "$RUN_ID"; then
                STATUS=$(gh run view "$RUN_ID" --json status --jq ".status")
                if [ "$STATUS" != "completed" ]; then
                  exit 1
                fi
                echo "Build run $name/$RUN_ID already completed."
              fi
            done
          '
      - name: MT check out submodules
        run: ./sh/git/submodules_init.sh
      - name: MT setup MT_GIT_BRANCH env
        if: github.event_name != 'pull_request'
        run: |
          echo "MT_GIT_BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: MT git sync
        # if: github.event_name != 'pull_request'
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: ./commons/sh/git_sync.sh || ./commons/code_sync.sh
      - name: MT git setup
        run: ./commons/sh/git_setup.sh
      - name: MT shared setup
        run: ./commons/sh/shared_setup.sh
      - name: MT set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: MT detekt
        run: |
          ./gradlew detektAll \
            --no-configure-on-demand --scan # works better with "gradle/actions/setup-gradle"
      - name: MT detekt > print markdown report (if failure)
        if: ${{ failure() }}
        run: |
          mapfile -d '' reports < <(find . -path '*/build/reports/detekt/*.md' -print0)
          if (( ${#reports[@]} > 0 )); then
            cat -- "${reports[@]}"
          fi
      - name: MT detekt > artifact > XML results
        uses: actions/upload-artifact@v7
        if: ${{ always() }} # even if detekt fails
        with:
          name: detekt-xml-results
          path: |
            */build/reports/detekt/*.xml
      - name: MT detekt > artifact > HTML report
        uses: actions/upload-artifact@v7
        if: ${{ always() }} # even if detekt fails
        with:
          name: detekt-html-reports
          path: |
            */build/reports/detekt/*.html

      - name: MT tests
        if: ${{ success() }} # if detekt successful
        run: ./sh/ci/test_only.sh
      - name: MT tests > artifact > XML results
        uses: actions/upload-artifact@v7
        if: ${{ always() }} # even if tests fails
        with:
          name: test-xml-results
          path: |
            */build/test-results/**/*.xml
            */build/test-results/*.xml
            */build/reports/*.xml
      - name: MT tests > artifact > HTML reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }} # even if tests fails
        with:
          name: test-html-reports
          path: |
            */build/reports/
            !**/*.xml

      - name: MT commit code change
        run: ./sh/git/commit_code_change.sh
      - name: MT push commits
        run: ./sh/ci/push_commits.sh
      - name: MT commit data change
        run: ./sh/git/commit_data_change.sh
      - name: MT set app release required
        run: |
          mkdir -p .mt;
          # SKIP assemble (will be done after sync w/ target branch)
          echo "false" > .mt/mt_app_release_required;
      - name: MT assemble release (APK & AAB)
        run: ./app-android/sh/assemble_release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.MT_PAT }}
          MT_ENCRYPT_KEY: ${{ secrets.MT_ENCRYPT_KEY }}
      - name: MT artifact > app-android > APK & AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-android-apk-bundle
          path: |
            app-android/build/outputs/apk
            app-android/build/outputs/bundle
      - name: MT push commits
        run: ./sh/ci/push_commits.sh
      - name: MT restart latest canceled submodule builds
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.MT_PAT }}
        run: |
          FAILED=false
          git submodule foreach '
            DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq ".defaultBranchRef.name") || exit 1
            [ -n "$DEFAULT_BRANCH" ] || exit 1
            RUN_ID=$(gh run list --workflow mt-build.yml --branch "$DEFAULT_BRANCH" --status completed --limit 1000 \
              --json databaseId,conclusion,event \
              --jq "[.[] | select(.conclusion == \"cancelled\" and .event != \"pull_request\" and .event != \"pull_request_target\")][0].databaseId // empty") || exit 1
            if [ -n "$RUN_ID" ]; then
              echo "Rerunning canceled build $name/$RUN_ID..."
              if ! gh run rerun "$RUN_ID"; then
                exit 1
              fi
            fi
          ' || FAILED=true
          if [ "$FAILED" = true ]; then
            exit 1
          fi
