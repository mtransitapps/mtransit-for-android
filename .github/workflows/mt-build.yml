name: MT build
on:
  workflow_dispatch: # manual
  workflow_call: # re-use (called from submodule build and code sync workflows)
    inputs:
      code-sync:
        description: 'Sync code before checks and commit/push changes after checks pass.'
        type: boolean
        default: false
        required: false
      skip-assemble:
        description: 'Skip assembling the release APK and AAB.'
        type: boolean
        default: false
        required: false
  pull_request:
  push:
    branches:
      # - '**' # ALL
      - 'master'
      # TODO 'develop', 'main'?
# gh workflow run mt-build.yml --ref <branch>
# gh run list --workflow=mt-build.yml
concurrency:
  # A reusable workflow shares github.workflow with its caller.
  group: ${{ github.workflow }}-build-${{ github.ref || github.head_ref }}
  cancel-in-progress: true
env:
  MT_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  MT_TARGET_BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
  MT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MT_DEFAULT_BRANCH_NAME: ${{ github.event.repository.default_branch }}
  MT_ORG_GIT_COMMIT_ON: ${{ inputs.code-sync && secrets.MT_ORG_GIT_COMMIT_ON || '' }}
  MT_ORG_GIT_COMMIT_OFF: ${{ inputs.code-sync && secrets.MT_ORG_GIT_COMMIT_OFF || '' }}
  MT_GIT_COMMIT_ON: ${{ inputs.code-sync && secrets.MT_GIT_COMMIT_ON || '' }}
  MT_GIT_COMMIT_OFF: ${{ inputs.code-sync && secrets.MT_GIT_COMMIT_OFF || '' }}

jobs:

  MT-SELECT-BRANCH-JOB:
    name: "MT Select branch"
    runs-on: ubuntu-latest
    outputs:
      mt_checkout_branch: ${{ steps.mt-select-branch.outputs.mt_checkout_branch }}
    steps:
      - name: MT wait for main & submodule merge to target branch
        run: sleep 10
      - name: MT select main repo checkout branch
        id: mt-select-branch
        env:
          GH_TOKEN: ${{ github.token }} # GitHub CLI in a GitHub Actions workflow
        run: |
          REPOSITORY_OWNER_AND_NAME=${{ github.repository }};
          REPOSITORY_NAME=$(basename $REPOSITORY_OWNER_AND_NAME);
          if [ $REPOSITORY_OWNER_AND_NAME = "mtransitapps/mtransit-for-android" ]; then
            CHECKOUT_BRANCH="" # defaults to the reference or SHA for that event
          else
            MAIN_REPO_URL="https://github.com/mtransitapps/mtransit-for-android.git"
            BRANCH_EXISTS=$(git ls-remote --heads $MAIN_REPO_URL $MT_BRANCH_NAME | wc -l);
            if [ $BRANCH_EXISTS -eq 1 ]; then
              CHECKOUT_BRANCH=$MT_BRANCH_NAME
            else
              # Pull request target branch with same name?
              BRANCH_EXISTS=$(git ls-remote --heads $MAIN_REPO_URL $MT_TARGET_BRANCH_NAME | wc -l);
              if [ $BRANCH_EXISTS -eq 1 ]; then
                CHECKOUT_BRANCH=$MT_TARGET_BRANCH_NAME
              else
                echo "WARNING: no match for current or target branch!!!"
                DEFAULT_REPO_BRANCH=$(gh api repos/mtransitapps/mtransit-for-android --jq '.default_branch');
                CHECKOUT_BRANCH=$DEFAULT_REPO_BRANCH
              fi
            fi
          fi
          echo "Checkout branch: '$CHECKOUT_BRANCH'."
          echo "mt_checkout_branch=$CHECKOUT_BRANCH" >> "$GITHUB_OUTPUT"

  MT-TESTS-JOB:
    name: "MT Tests"
    needs: MT-SELECT-BRANCH-JOB
    runs-on: ubuntu-latest
    outputs:
      mt_source_revision: ${{ steps.mt-source.outputs.revision }}
    steps:

      - name: MT check out main repo
        uses: actions/checkout@v7
        with:
          repository: mtransitapps/mtransit-for-android
          ref: ${{ needs.MT-SELECT-BRANCH-JOB.outputs.mt_checkout_branch }}
          token: ${{ !inputs.code-sync && github.token || secrets.MT_PAT }}
          submodules: true # required to set right token
          fetch-depth: 0 # fetch all (not required util release build)
      - name: MT setup
        id: mt-setup
        uses: mtransitapps/gh-actions/.github/actions/setup@v1.5.0
        with:
          code-sync: ${{ inputs.code-sync }}
      - name: MT record synced source revision
        id: mt-source
        if: ${{ inputs.code-sync }}
        run: |
          revision=$({ git rev-parse HEAD; git submodule status --recursive | awk '{ print $1, $2 }'; } | sha256sum | cut -c 1-64)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: MT compile # fail fast before detekt & unit tests
        id: mt-compile
        run: |
          ./gradlew compileAll \
            --no-configure-on-demand --scan

      - name: MT detekt
        id: mt-detekt
        continue-on-error: true # run tests even if detekt fails (job failed at the end)
        run: |
          ./gradlew detektAll \
            --no-configure-on-demand --scan # works better with "gradle/actions/setup-gradle"
      - name: MT detekt > print markdown report (if failure)
        if: ${{ steps.mt-detekt.outcome == 'failure' }}
        run: |
          mapfile -d '' reports < <(find . -path '*/build/reports/detekt/*.md' -print0)
          if (( ${#reports[@]} > 0 )); then
            cat -- "${reports[@]}"
          fi
      - name: MT detekt > artifact > XML results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: detekt-xml-results
          path: |
            */build/reports/detekt/*.xml
      - name: MT detekt > artifact > HTML report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: detekt-html-reports
          path: |
            */build/reports/detekt/*.html

      - name: MT tests
        id: mt-tests
        if: ${{ !cancelled() && steps.mt-compile.outcome == 'success' }} # run even if detekt failed
        run: ./sh/ci/test_only.sh
      - name: MT tests > artifact > XML results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-xml-results
          path: |
            */build/test-results/**/*.xml
            */build/test-results/*.xml
            */build/reports/*.xml
      - name: MT tests > artifact > HTML reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-html-reports
          path: |
            */build/reports/
            !**/*.xml

      - name: "MT checks failed — detekt: ${{ steps.mt-detekt.outcome }}, tests: ${{ steps.mt-tests.outcome }}"
        if: ${{ !cancelled() && (steps.mt-detekt.outcome == 'failure' || steps.mt-tests.outcome == 'failure') }}
        run: |
          if [[ "${{ steps.mt-detekt.outcome }}" == "failure" ]]; then
            echo "::error title=Detekt failed::See the MT detekt step and uploaded reports."
          fi
          if [[ "${{ steps.mt-tests.outcome }}" == "failure" ]]; then
            echo "::error title=Tests failed::See the MT tests step and uploaded reports."
          fi
          exit 1

  MT-LINT-JOB:
    name: "MT Lint"
    needs: MT-SELECT-BRANCH-JOB
    runs-on: ubuntu-latest
    outputs:
      mt_source_revision: ${{ steps.mt-source.outputs.revision }}
    steps:

      - name: MT check out main repo
        uses: actions/checkout@v7
        with:
          repository: mtransitapps/mtransit-for-android
          ref: ${{ needs.MT-SELECT-BRANCH-JOB.outputs.mt_checkout_branch }}
          token: ${{ !inputs.code-sync && github.token || secrets.MT_PAT }}
          submodules: true # required to set right token
          fetch-depth: 0 # fetch all (not required util release build)
      - name: MT setup
        id: mt-setup
        uses: mtransitapps/gh-actions/.github/actions/setup@v1.5.0
        with:
          code-sync: ${{ inputs.code-sync }}
      - name: MT record synced source revision
        id: mt-source
        if: ${{ inputs.code-sync }}
        run: |
          revision=$({ git rev-parse HEAD; git submodule status --recursive | awk '{ print $1, $2 }'; } | sha256sum | cut -c 1-64)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: MT lint
        run: ./app-android/sh/lint_only.sh
      - name: MT lint > print text report (if failure)
        if: ${{ failure() }}
        run: |
          cat app-android/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
      - name: MT lint > artifact > XML reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }} # even if tests fails
        with:
          name: lint-xml-results
          path: |
            */build/reports/*.xml
      - name: MT lint > artifact > HTML reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }} # even if tests fails
        with:
          name: lint-html-reports
          path: |
            */build/reports/
            !**/*.xml

  MT-ASSEMBLE-JOB:
    name: "MT Assemble"
    needs: MT-SELECT-BRANCH-JOB
    if: ${{ github.event_name != 'pull_request' && !inputs.skip-assemble }}
    runs-on: ubuntu-latest
    steps:

      - name: MT check out main repo
        uses: actions/checkout@v7
        with:
          repository: mtransitapps/mtransit-for-android
          ref: ${{ needs.MT-SELECT-BRANCH-JOB.outputs.mt_checkout_branch }}
          token: ${{ !inputs.code-sync && github.token || secrets.MT_PAT }}
          submodules: true # required to set right token
          fetch-depth: 0 # fetch all (not required util release build)
      - name: MT setup
        id: mt-setup
        uses: mtransitapps/gh-actions/.github/actions/setup@v1.5.0
        with:
          code-sync: ${{ inputs.code-sync }}

      - name: MT assemble release (APK & AAB)
        run: ./app-android/sh/assemble_release.sh
        env:
          MT_ENCRYPT_KEY: ${{ secrets.MT_ENCRYPT_KEY }}
      - name: MT artifact > app-android > APK & AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-android-apk-bundle
          path: |
            app-android/build/outputs/apk
            app-android/build/outputs/bundle

  MT-SYNC-CODE-JOB:
    name: "MT Sync Code"
    needs: [MT-SELECT-BRANCH-JOB, MT-TESTS-JOB, MT-LINT-JOB]
    if: ${{ inputs.code-sync && github.event_name != 'pull_request' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: MT check out main repo
        uses: actions/checkout@v7
        with:
          repository: mtransitapps/mtransit-for-android
          ref: ${{ needs.MT-SELECT-BRANCH-JOB.outputs.mt_checkout_branch }}
          submodules: true # required to set right token
          token: ${{ secrets.MT_PAT }}
          fetch-depth: 0 # required to push commits
      - name: MT setup
        uses: mtransitapps/gh-actions/.github/actions/setup@v1.5.0
        with:
          code-sync: true
      - name: MT verify synced source matches checks
        env:
          MT_TESTED_REVISION: ${{ needs.MT-TESTS-JOB.outputs.mt_source_revision }}
          MT_LINTED_REVISION: ${{ needs.MT-LINT-JOB.outputs.mt_source_revision }}
        run: |
          revision=$({ git rev-parse HEAD; git submodule status --recursive | awk '{ print $1, $2 }'; } | sha256sum | cut -c 1-64)
          if [[ "$revision" != "$MT_TESTED_REVISION" || "$revision" != "$MT_LINTED_REVISION" ]]; then
            echo "::error::Synced source changed between checks and commit. Re-run the workflow to check the latest code."
            exit 1
          fi
      - name: MT commit code change
        run: ./sh/git/commit_code_change.sh
      - name: MT commit data change
        run: ./sh/git/commit_data_change.sh
      - name: MT push commits
        run: ./sh/ci/push_commits.sh
